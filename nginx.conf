server {
    listen 8080;
    server_name localhost;

    include /etc/nginx/mime.types;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Megakadályozza, hogy az Nginx belső portot írjon az átirányításokba
    port_in_redirect off;
    absolute_redirect off;

    location / {
        # Először a konkrét fájlt keresi ($uri)
        # Ha az nem létezik, megnézi a mappa index.html-jét ($uri/index.html)
        # Végül kipróbálja a mappa átirányítást ($uri/)
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Statikus assetek (CSS, JS, képek) kiszolgálása
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
