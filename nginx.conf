server {
    listen 8080;
    server_name localhost;

    include /etc/nginx/mime.types;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # MEGOLDÁS A PORT PROBLÉMÁRA:
    # Kikapcsolja a port beillesztését az átirányításokba
    port_in_redirect off;
    # Relatív átirányításokat használ a protokoll/domain/port elhagyásával
    absolute_redirect off;

    location / {
        # A try_files közvetlenül a mappa index.html-jét szolgálja ki,
        # megkerülve az Nginx belső átirányítási logikáját
        try_files $uri $uri/index.html $uri/ =404;
    }

    # Statikus assetek (CSS, JS, képek) kiszolgálása
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
