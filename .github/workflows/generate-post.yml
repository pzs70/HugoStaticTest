name: Generate Post from Issue Prompt (Gemini API)

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  generate:
    # 1. Csak akkor fut le, ha a cím "post:" prefixszel kezdődik
    if: startsWith(github.event.issue.title, 'post:')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_PAT }}
          
      # 2. ENGEDÉLYEZÉSI ELLENŐRZÉS (Jogosultság szűrése)
      - name: Check user authorization
        env:
          AUTHOR: ${{ github.actor }}
          ALLOWED_USERS: "pzs70"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Issue-t nyitotta: $AUTHOR"
          
          # Ellenőrzés: benne van-e a felhasználó a megengedett listában
          if [[ " $ALLOWED_USERS " =~ " $AUTHOR " ]]; then
            echo "A felhasználó jogosult a futtatásra."
          else
            echo "HIBA: $AUTHOR nem jogosult az automatikus cikkgenerálásra!"
            gh issue comment ${{ github.event.issue.number }} --body "A cikkgenerálás megszakadt: Nincs jogosultságod a funkció használatához."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install google-genai

      # 3. CIKK GENERÁLÁSA GEMINI API-VAL
      - name: Generate Post with Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python - << 'EOF'
          import os
          import re
          from datetime import datetime, timezone, timedelta
          from google import genai
          from google.genai import types

          prompt_title = os.environ.get("ISSUE_TITLE", "").replace("post:", "").strip()
          prompt_body = os.environ.get("ISSUE_BODY", "")
          api_key = os.environ.get("GEMINI_API_KEY")

          if not api_key:
              raise ValueError("Hiányzik a GEMINI_API_KEY környezeti változó!")

          client = genai.Client(api_key=api_key)

          # Mai pontos dátum ISO formátumban (pl. 2026-08-19T15:00:00+02:00)
          tz_hu = timezone(timedelta(hours=2))
          current_now = datetime.now(tz_hu)
          iso_date = current_now.strftime('%Y-%m-%dT%H:%M:%S+02:00')

          system_instruction = """
          Te egy profi Hugo blogbejegyzés-író vagy. A feladatod, hogy a megadott téma alapján generálj egy teljes, minőségi Markdown cikk-fájlt.
          A kimeneted KIZÁRÓLAG érvényes Markdown kódot tartalmazzon, az elején érvényes Hugo YAML Front Matter fejléccel!
          Ne tegyél semmilyen egyéb felvezető vagy lezáró szöveget a válaszba, csak magát a Markdown kódot.
          Példa a fejlécre:
          ---
          title: "Cím"
          draft: false
          categories: ["Blog"]
          ---
          """

          user_prompt = f"Cím/Téma: {prompt_title}\nRészletes utasítások: {prompt_body}"

          chat = client.chats.create(
              model='gemini-2.5-flash',
              config=types.GenerateContentConfig(
                  system_instruction=system_instruction,
                  temperature=0.7,
              )
          )
          response = chat.send_message(user_prompt)
          content = response.text

          # Tisztítás
          content = re.sub(r'^```markdown\s*', '', content)
          content = re.sub(r'^```\s*', '', content)
          content = re.sub(r'\s*```$', '', content)

          # Dinamikus dátum beszúrása a Front Matter-be
          if "date:" in content:
              content = re.sub(r'date:.*', f'date: {iso_date}', content)
          else:
              content = re.sub(r'(---)', f'\\1\ndate: {iso_date}', content, count=1)

          # Ékezetmentesítés és tisztítás a fájlnévhez
          slug = prompt_title.lower()
          for a, b in [('á','a'),('é','e'),('í','i'),('ó','o'),('ö','o'),('ő','o'),('ú','u'),('ü','u'),('ű','u')]:
              slug = slug.replace(a, b)
          slug = re.sub(r'[^a-zA-Z0-9-]', '', slug.replace(' ', '-'))
          
          output_dir = "content/blog"
          filename = f"{output_dir}/{current_now.strftime('%Y-%m-%d')}-{slug}.md"

          os.makedirs(output_dir, exist_ok=True)
          with open(filename, "w", encoding="utf-8") as f:
              f.write(content)

          print(f"Fájl sikeresen létrehozva a mai dátummal ({iso_date}): {filename}")
          EOF
          
      # 4. COMMIT ÉS PUSH A MAIN BRANCH-BE
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add content/blog/
          git commit -m "feat(blog): auto-generated post via Gemini (Issue #${{ github.event.issue.number }})"
          git push origin main
          
      # 5. ISSUE BEZÁRÁSA
      - name: Close Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue close ${{ github.event.issue.number }} --comment "A cikk sikeresen elkészült a Gemini API segítségével és publikálásra került!"
